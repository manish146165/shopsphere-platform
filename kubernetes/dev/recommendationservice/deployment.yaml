apiVersion: apps/v1
kind: Deployment

metadata:
  name: recommendationservice
  namespace: shopsphere

  labels:
    app: recommendationservice
    app.kubernetes.io/name: recommendationservice
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shopsphere
    app.kubernetes.io/managed-by: kubectl

spec:

  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: recommendationservice

  template:

    metadata:

      labels:
        app: recommendationservice
        app.kubernetes.io/name: recommendationservice
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: shopsphere

    spec:

      terminationGracePeriodSeconds: 30

      containers:

      - name: recommendationservice

        image: 221237748109.dkr.ecr.ap-south-1.amazonaws.com/shopsphere:recommendationservice-v1

        imagePullPolicy: Always

        ports:

        - name: grpc
          containerPort: 8080

        env:

        - name: PORT
          value: "8080"

        - name: DISABLE_PROFILER
          value: "1"

        - name: DISABLE_TRACING
          value: "1"

        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"

        - name: OTEL_SERVICE_NAME
          value: "recommendationservice"

        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"

        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"

        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=recommendationservice,deployment.environment=dev"

        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 300m
            memory: 256Mi

        readinessProbe:

          tcpSocket:
            port: 8080

          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:

          tcpSocket:
            port: 8080

          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
