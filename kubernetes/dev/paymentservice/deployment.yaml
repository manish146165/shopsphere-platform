apiVersion: apps/v1
kind: Deployment

metadata:
  name: paymentservice
  namespace: shopsphere

  labels:
    app: paymentservice
    app.kubernetes.io/name: paymentservice
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shopsphere
    app.kubernetes.io/managed-by: kubectl

spec:

  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: paymentservice

  template:

    metadata:

      labels:
        app: paymentservice
        app.kubernetes.io/name: paymentservice
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: shopsphere

    spec:

      terminationGracePeriodSeconds: 30

      containers:

      - name: paymentservice

        image: 221237748109.dkr.ecr.ap-south-1.amazonaws.com/shopsphere:paymentservice-v1

        imagePullPolicy: Always

        ports:

        - name: grpc
          containerPort: 50051

        env:

        - name: PORT
          value: "50051"

        - name: DISABLE_PROFILER
          value: "1"

        - name: DISABLE_TRACING
          value: "1"

        - name: DISABLE_STATS
          value: "1"

        - name: OTEL_SERVICE_NAME
          value: "paymentservice"

        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"

        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"

        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=paymentservice,deployment.environment=dev"

        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 250m
            memory: 256Mi

        readinessProbe:

          tcpSocket:
            port: 50051

          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:

          tcpSocket:
            port: 50051

          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
