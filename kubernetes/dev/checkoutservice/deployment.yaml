apiVersion: apps/v1
kind: Deployment

metadata:
  name: checkoutservice
  namespace: shopsphere

  labels:
    app: checkoutservice
    app.kubernetes.io/name: checkoutservice
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shopsphere
    app.kubernetes.io/managed-by: kubectl

spec:

  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: checkoutservice

  template:

    metadata:

      labels:
        app: checkoutservice
        app.kubernetes.io/name: checkoutservice
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: shopsphere

    spec:

      terminationGracePeriodSeconds: 30

      containers:

      - name: checkoutservice

        image: 221237748109.dkr.ecr.ap-south-1.amazonaws.com/shopsphere:checkoutservice-v1

        imagePullPolicy: Always

        ports:

        - name: grpc
          containerPort: 5050

        env:

        - name: PORT
          value: "5050"

        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"

        - name: SHIPPING_SERVICE_ADDR
          value: "shippingservice:50051"

        - name: PAYMENT_SERVICE_ADDR
          value: "paymentservice:50051"

        - name: EMAIL_SERVICE_ADDR
          value: "emailservice:8080"

        - name: CURRENCY_SERVICE_ADDR
          value: "currencyservice:7000"

        - name: CART_SERVICE_ADDR
          value: "cartservice:7070"

        - name: ENABLE_TRACING
          value: "0"

        - name: ENABLE_PROFILER
          value: "0"

        - name: OTEL_SERVICE_NAME
          value: "checkoutservice"

        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"

        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"

        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=checkoutservice,deployment.environment=dev"

        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 300m
            memory: 256Mi

        readinessProbe:

          tcpSocket:
            port: 5050

          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:

          tcpSocket:
            port: 5050

          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
